<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Capsule continuity sweep</title>
  <desc id="desc">Comparison of full internal-state capsule resume against surface-only replay for canonical v9 and v9 five-channel.</desc>
  <rect width="920" height="420" fill="#0d1117"/>
  <text x="42" y="54" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Capsule continuity sweep</text>
  <text x="42" y="84" font-family="Arial, sans-serif" font-size="14" fill="#8b949e">hidden=16, seeds=94/95/96, windows=16:16 and 24:24, CPU deterministic probe</text>

  <line x1="250" y1="125" x2="250" y2="325" stroke="#30363d" stroke-width="1"/>
  <line x1="385" y1="125" x2="385" y2="325" stroke="#21262d" stroke-width="1"/>
  <line x1="520" y1="125" x2="520" y2="325" stroke="#21262d" stroke-width="1"/>
  <line x1="655" y1="125" x2="655" y2="325" stroke="#21262d" stroke-width="1"/>
  <line x1="790" y1="125" x2="790" y2="325" stroke="#30363d" stroke-width="1"/>

  <text x="42" y="154" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#f0f6fc">demian_native_v9</text>
  <text x="42" y="194" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">full capsule min cosine</text>
  <rect x="250" y="178" width="540" height="22" rx="3" fill="#2dd4bf"/>
  <text x="802" y="195" font-family="Arial, sans-serif" font-size="13" fill="#f0f6fc">0.99999988</text>
  <text x="42" y="229" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">surface-only max cosine</text>
  <rect x="250" y="213" width="49" height="22" rx="3" fill="#f59e0b"/>
  <text x="311" y="230" font-family="Arial, sans-serif" font-size="13" fill="#f0f6fc">0.0910</text>

  <text x="42" y="284" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#f0f6fc">v9_five_channel</text>
  <text x="42" y="324" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">full capsule min cosine</text>
  <rect x="250" y="308" width="540" height="22" rx="3" fill="#2dd4bf"/>
  <text x="802" y="325" font-family="Arial, sans-serif" font-size="13" fill="#f0f6fc">0.99999988</text>
  <text x="42" y="359" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">surface-only max cosine</text>
  <rect x="250" y="343" width="95" height="22" rx="3" fill="#f59e0b"/>
  <text x="357" y="360" font-family="Arial, sans-serif" font-size="13" fill="#f0f6fc">0.1752</text>

  <text x="245" y="348" font-family="Arial, sans-serif" font-size="11" fill="#8b949e">0</text>
  <text x="778" y="348" font-family="Arial, sans-serif" font-size="11" fill="#8b949e">1.0 cosine</text>
  <rect x="42" y="376" width="14" height="14" rx="2" fill="#2dd4bf"/>
  <text x="64" y="388" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">full internal-state capsule</text>
  <rect x="230" y="376" width="14" height="14" rx="2" fill="#f59e0b"/>
  <text x="252" y="388" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">surface-only replay</text>
</svg>
