<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
<title id="title">v9 five-channel anatomy</title>
<desc id="desc">2D routing diagram for fast, slow, control, message, and carrier channels with quadratic edge opacity.</desc>
<rect width="920" height="420" fill="#f7f7f4"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#33383d"/></marker></defs>
<text x="42" y="54" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#202124">v9 five-channel anatomy</text>
<text x="42" y="84" font-family="Arial, sans-serif" font-size="13" fill="#4c535a">routing scaffold for Demian v1 work; edge opacity uses squared route scale</text>
<line x1="178" y1="188" x2="352" y2="120" stroke="#33383d" stroke-width="2.31" opacity="0.287" marker-end="url(#arrow)"><title>fast to message: scale 0.25</title></line>
<line x1="352" y1="120" x2="552" y2="120" stroke="#33383d" stroke-width="3.09" opacity="0.409" marker-end="url(#arrow)"><title>message to carrier: scale 0.35</title></line>
<line x1="552" y1="120" x2="724" y2="188" stroke="#33383d" stroke-width="2.31" opacity="0.287" marker-end="url(#arrow)"><title>carrier to slow: scale 0.25</title></line>
<line x1="724" y1="188" x2="452" y2="286" stroke="#33383d" stroke-width="3.09" opacity="0.409" marker-end="url(#arrow)"><title>slow to control: scale 0.35</title></line>
<line x1="452" y1="286" x2="178" y2="188" stroke="#33383d" stroke-width="6.50" opacity="0.940" marker-end="url(#arrow)"><title>control to fast: scale 0.62</title></line>
<line x1="352" y1="120" x2="178" y2="188" stroke="#33383d" stroke-width="1.69" opacity="0.189" marker-end="url(#arrow)"><title>message to fast: scale 0.12</title></line>
<line x1="552" y1="120" x2="178" y2="188" stroke="#33383d" stroke-width="1.58" opacity="0.173" marker-end="url(#arrow)"><title>carrier to fast: scale 0.08</title></line>
<circle cx="178" cy="188" r="48" fill="#137970" opacity="0.94"/>
<text x="178" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">fast</text>
<circle cx="352" cy="120" r="48" fill="#2a578d" opacity="0.94"/>
<text x="352" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">message</text>
<circle cx="552" cy="120" r="48" fill="#6d5c9c" opacity="0.94"/>
<text x="552" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">carrier</text>
<circle cx="724" cy="188" r="48" fill="#a84e4b" opacity="0.94"/>
<text x="724" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">slow</text>
<circle cx="452" cy="286" r="48" fill="#8a6a23" opacity="0.94"/>
<text x="452" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">control</text>
<text x="42" y="368" font-family="Arial, sans-serif" font-size="12" fill="#4c535a">The visual is an anatomy map, not a performance claim. It shows explicit state owners and route directions used by the current v9 five-channel probe.</text>
</svg>
